%YAML 1.2
---
$id: http://devicetree.org/schemas/net/beechat,rf215.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip AT86RF215 sub-GHz / 2.4 GHz transceiver

maintainers:
  - Beechat Network Systems Ltd.

description: |
  The AT86RF215 carries two independent transceivers, sub-GHz and 2.4 GHz,
  behind a single SPI interface and a single shared interrupt line.

properties:
  compatible:
    enum:
      - beechat,rf215
      - microchip,at86rf215

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 25000000

  interrupts:
    maxItems: 1
    description: Shared interrupt for both transceivers, active high by default.

  reset-gpios:
    maxItems: 1
    description: Chip reset, active low.

  rf09-disable:
    type: boolean
    description:
      The sub-GHz transceiver is not used on this board. No interface is
      created for it and its interrupts stay masked.

  rf24-disable:
    type: boolean
    description:
      The 2.4 GHz transceiver is not used on this board. No interface is
      created for it and its interrupts stay masked.

  pad-drive-milliamp:
    description:
      Drive strength of the chip's digital output pads (MISO, interrupt). A
      weak pad into a long or capacitive track corrupts reads at high SPI
      clocks.
    enum: [2, 4, 6, 8]
    default: 8

  ext-lna-bypass:
    description:
      Whether the external low noise amplifier is bypassed, for the sub-GHz
      and the 2.4 GHz front end in that order. Bypass a front end that has no
      amplifier fitted, or one that a transmitter on the same board would
      saturate.
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 2
    items:
      enum: [0, 1]
    default: [0, 1]

  agc-gain-map:
    description:
      Gain of the external amplifier the automatic gain control has to allow
      for. 0 is none, 1 is +9 dB, 2 is +12 dB.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2]
    default: 2

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios

# A chip with neither transceiver in use has nothing to bind.
not:
  required:
    - rf09-disable
    - rf24-disable

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        radio@0 {
            compatible = "beechat,rf215";
            reg = <0>;
            spi-max-frequency = <25000000>;
            interrupt-parent = <&gpioa>;
            interrupts = <5 IRQ_TYPE_LEVEL_HIGH>;
            reset-gpios = <&gpiob 2 GPIO_ACTIVE_LOW>;
        };
    };
